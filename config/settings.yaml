# Configuração principal da fábrica de Shorts GTA 6.
# Segredos NUNCA ficam aqui — use variáveis de ambiente / GitHub Secrets (ver .env.example).

channel:
  language: pt-BR
  timezone: America/Sao_Paulo
  # Horários de publicação (Brasília). Configuráveis.
  publish_slots: ["09:00", "12:30", "17:30", "21:00"]
  videos_per_day: 4
  # "private" + publishAt = agendamento nativo do YouTube.
  # Use dry_run=true para renderizar sem enviar.
  upload_privacy: private
  category_id: "20"          # Gaming
  made_for_kids: false
  # Narração sintética de um narrador fictício (não imita pessoa real) e imagens oficiais não
  # alteradas: pelas regras do YouTube não exige o rótulo de conteúdo alterado. Ajuste se mudar.
  contains_synthetic_media: false
  default_hashtags: ["#games", "#shorts"]

video:
  width: 1080
  height: 1920
  fps: 30
  min_seconds: 15
  target_min_seconds: 25
  target_max_seconds: 50
  max_seconds: 59
  crf: 20
  preset: medium
  # Selo OFICIAL/REPORTADO e crédito "Imagens: Rockstar Games" na tela (desligados a pedido do dono do canal;
  # o status e o crédito continuam na descrição de cada vídeo).
  show_badge: false
  show_credit: false

voice:
  # Tentados em ordem. Fenrir (Google Gemini TTS, camada gratuita) foi a voz escolhida pelo dono do canal.
  # O texto de estilo vai em inglês curto: o modelo 2.5 o interpreta como direção, sem ler em voz alta.
  engines:
    - {engine: gemini, model: gemini-2.5-flash-preview-tts, voice: Fenrir, style: "Say excitedly, like a funny Brazilian YouTuber:"}
    - {engine: gemini, model: gemini-3.8-flash-tts, voice: Fenrir, style: ""}
    - {engine: edge, voice: pt-BR-AntonioNeural}
    - {engine: piper, voice: pt_BR-faber-medium}
  piper_voice: pt_BR-faber-medium
  edge_voice: pt-BR-AntonioNeural
  speed: 1.08                # >1 = mais rápido
  sentence_pause_ms: 140
  target_lufs: -14

subtitles:
  whisper_model: small        # tiny|base|small — small é bom em PT no CPU
  max_words_per_chunk: 3
  min_alignment_ratio: 0.80   # % mínimo de palavras do roteiro reconhecidas no áudio

llm:
  # Ordem de tentativa. Todos são endpoints compatíveis com OpenAI.
  # GitHub Models foi descontinuado em 30/07/2026. Camadas gratuitas atuais (nov/2026):
  # Gemini Flash-Lite ~500 req/dia; Groq ~1.000 req/dia. Uso da fábrica: ~40 req/dia.
  # "model" pode ser uma lista: o primeiro que existir na conta é usado.
  providers:
    - name: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      model: [gemini-3.5-flash-lite, gemini-3.1-flash-lite, gemini-2.5-flash-lite]
      api_key_env: GEMINI_API_KEY
    - name: groq
      base_url: https://api.groq.com/openai/v1
      model: [openai/gpt-oss-120b, llama-3.3-70b-versatile]
      api_key_env: GROQ_API_KEY
  max_input_chars: 22000
  temperature: 0.8

research:
  max_article_age_days: 21
  fetch_article_text: true
  user_agent: "Mozilla/5.0 (compatible; gta6-shorts-research/1.0)"

editorial:
  min_topic_score: 45
  similarity_block: 82        # rapidfuzz token_set_ratio contra pautas já usadas
  evergreen_cooldown_days: 30

music:
  enabled: true               # trilha procedural gerada pelo próprio sistema (sem licença de terceiros)
  bed_db: -24                 # volume da música relativo à narração
longform:
  # Vídeo longo diário "Games Hoje" (16:9) publicado no YouTube. Não vai para o TikTok.
  enabled: true
  publish_time: "19:00"
  chapters: 9                   # ~9-10 min com abertura, vinhetas e encerramento
  min_chapters: 6
  min_minutes: 6
  max_minutes: 14

tiktok:
  # O TikTok não permite postagem automática pública por ferramenta própria (ver docs/LEGAL.md).
  # O vídeo + legenda chegam no Telegram logo após a aprovação, com o horário sugerido de postagem.
  deliver_time: "09:00"         # os 4 vídeos do dia chegam juntos no Telegram nesse horário (BRT)
  extra_hashtags: []

automation:
  # Deve espelhar o cron de .github/workflows/factory.yml (UTC). Usado no painel.
  # 23:17, 02:17, 05:17 (produção do dia, com 2 retentativas), 09:02 (entrega no Telegram),
  # 11:17 e 17:17 (retentativas/confirmações). Espelha .github/workflows/factory.yml.
  cron_hours_utc: [2, 3, 5, 6, 8, 9, 12, 14, 20]
  cron_minute: 17
  produce_window_hours: 23      # a execução das 23h produz todos os slots do dia seguinte
  min_lead_minutes: 40          # não inicia produção para slot a menos de N minutos
  max_attempts: 4
  run_time_budget_minutes: 120  # não inicia nova renderização após esse tempo (o vídeo longo leva ~25 min)
  tag_assets_per_run: 12

paths:
  data_dir: data
  cache_dir: .cache
  output_dir: output
