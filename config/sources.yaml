# Fontes monitoradas. tier define confiabilidade:
#   official   -> pode CONFIRMAR fatos (Rockstar / Take-Two)
#   press      -> REPORTA fatos (jornalismo especializado identificado)
#   aggregator -> só descobre links; o status vem da fonte original
#   community  -> apenas ideias/teorias, NUNCA confirma nada
feeds:
  # --- oficiais (plataformas/produtoras confirmam os próprios anúncios) ---
  - id: rockstar_newswire_gnews
    name: Rockstar Newswire (via Google News)
    url: "https://news.google.com/rss/search?q=site:rockstargames.com+%22Grand+Theft+Auto+VI%22&hl=en-US&gl=US&ceid=US:en"
    tier: official
    require_domain: rockstargames.com
  - id: rockstar_youtube
    name: Rockstar Games (YouTube oficial)
    url: "https://www.youtube.com/feeds/videos.xml?user=RockstarGames"
    tier: official
  - id: playstation_blog
    name: PlayStation Blog
    url: "https://blog.playstation.com/feed/"
    tier: official
  - id: steam_news
    name: Steam (Valve)
    url: "https://store.steampowered.com/feeds/news.xml"
    tier: official
  # --- imprensa especializada ---
  - id: ign
    name: IGN
    url: "https://www.ign.com/rss/articles/feed"
    tier: press
  - id: ign_br
    name: IGN Brasil
    url: "https://br.ign.com/feed.xml"
    tier: press
  - id: gamespot
    name: GameSpot
    url: "https://www.gamespot.com/feeds/news/"
    tier: press
  - id: eurogamer
    name: Eurogamer
    url: "https://www.eurogamer.net/feed"
    tier: press
  - id: vgc
    name: Video Games Chronicle
    url: "https://www.videogameschronicle.com/feed/"
    tier: press
  - id: pcgamer
    name: PC Gamer
    url: "https://www.pcgamer.com/rss/"
    tier: press
    keyword_filter: true
  - id: gamesradar
    name: GamesRadar+
    url: "https://www.gamesradar.com/feeds/all/"
    tier: press
    keyword_filter: true
  - id: nintendolife
    name: Nintendo Life
    url: "https://www.nintendolife.com/feeds/latest"
    tier: press
  - id: theverge
    name: The Verge Games
    url: "https://www.theverge.com/rss/games/index.xml"
    tier: press
  # --- agregadores (descoberta; o status vem do veículo original) ---
  - id: gnews_ptbr_games
    name: Google News PT-BR (games)
    url: "https://news.google.com/rss/search?q=games+OR+videogame+OR+PlayStation+OR+Xbox+OR+Nintendo+OR+Steam&hl=pt-BR&gl=BR&ceid=BR:pt-419"
    tier: aggregator
  - id: gnews_ptbr
    name: Google News PT-BR (GTA 6)
    url: "https://news.google.com/rss/search?q=%22GTA+6%22+OR+%22GTA+VI%22&hl=pt-BR&gl=BR&ceid=BR:pt-419"
    tier: aggregator
  # --- comunidade (só ideias/teorias) ---
  - id: reddit_gaming
    name: r/gaming (comunidade)
    url: "https://www.reddit.com/r/gaming/top/.rss?t=day"
    tier: community
  - id: reddit_gta6
    name: r/GTA6 (comunidade)
    url: "https://www.reddit.com/r/GTA6/top/.rss?t=day"
    tier: community

# Páginas oficiais usadas como evidência para pautas atemporais.
official_pages:
