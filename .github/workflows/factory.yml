name: factory

# Execução agendada (sem servidor 24h). A madrugada tem 6 tentativas de produção dos 4 vídeos do dia;
# 09:02 e 09:32 entregam no Telegram; 11:17 e 17:17 refazem o que falhou e confirmam publicações.
on:
  schedule:
    - cron: "17 2,5,8,14,20 * * *"   # 23:17 02:17 05:17 11:17 17:17 BRT
    - cron: "47 3,6,9 * * *"         # 00:47 03:47 06:47 BRT (redundância: o cron gratuito do GitHub atrasa/pula)
    - cron: "2,32 12 * * *"          # 09:02 e 09:32 BRT (entrega no Telegram)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Renderizar sem enviar ao YouTube"
        type: boolean
        default: false

permissions:
  contents: write   # snapshot do banco no branch 'state' + release temporário dos vídeos

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      FACTORY_PENDING_DIR: ${{ github.workspace }}/pending
      FACTORY_DATA_DIR: ${{ github.workspace }}/state/data
      FACTORY_LOG_DIR: ${{ github.workspace }}/logs
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar estado persistente (branch state)
        run: |
          set -e
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch state "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" state
          else
            echo "Branch state ainda não existe; começando do zero."
          fi
          mkdir -p state/data logs pending
          # vídeos aprovados aguardando a entrega das 9h (release privado usado como depósito temporário)
          gh release download videos-pendentes --dir pending --pattern "*.mp4" --clobber 2>/dev/null || true
          ls -la pending

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Cache (kit oficial, vozes, modelo whisper)
        uses: actions/cache@v4
        with:
          path: .cache
          key: factory-cache-v1-${{ hashFiles('factory/assets/catalog.py', 'config/settings.yaml') }}
          restore-keys: factory-cache-v1-

      - name: Rodar fábrica
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACTORY_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || vars.FACTORY_DRY_RUN || '0' }}
        run: python -m factory.cli run

      - name: Guardar vídeos aprovados até a entrega / limpar entregues
        if: always()
        run: |
          gh release view videos-pendentes >/dev/null 2>&1 || \
            gh release create videos-pendentes --title "Vídeos aguardando entrega" \
              --notes "Depósito temporário automático: os MP4 ficam aqui só até a entrega das 9h." --latest=false
          if [ -s output/release_upload.txt ]; then
            while IFS= read -r f; do [ -f "$f" ] && gh release upload videos-pendentes "$f" --clobber; done < output/release_upload.txt
          fi
          if [ -s output/release_cleanup.txt ]; then
            existing=$(gh release view videos-pendentes --json assets --jq '.assets[].name')
            while IFS= read -r n; do
              echo "$existing" | grep -qxF "$n" && gh release delete-asset videos-pendentes "$n" -y
            done < output/release_cleanup.txt
          fi
          true

      - name: Persistir estado (snapshot único, sempre)
        if: always()
        run: |
          set -e
          cd state
          rm -rf .git data/run.lock
          git init -q -b state
          git config user.name "gta6-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "state snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) run ${{ github.run_id }}"
          for i in 1 2 3; do
            git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" state && break
            sleep 7
          done

      - name: Backup do banco
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-${{ github.run_id }}
          path: state/data/factory.db
          retention-days: 7
          if-no-files-found: ignore

      - name: Vídeos e logs para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_id }}
          path: |
            output/**/*.mp4
            output/**/storyboard.json
            logs/
          retention-days: 3
          if-no-files-found: ignore
