name: factory

# Execução agendada (sem servidor 24h). Horários em UTC = 23:17, 02:17, 05:17, 08:17, 11:17, 17:17 BRT.
# Cada execução: pesquisa -> preenche slots das próximas 10h -> produz -> QA -> envia agendado -> confirma.
on:
  schedule:
    - cron: "17 2,5,8,11,14,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Renderizar sem enviar ao YouTube"
        type: boolean
        default: false

permissions:
  contents: write   # gravar o snapshot do banco no branch 'state'
  models: read      # GitHub Models (LLM gratuito) via GITHUB_TOKEN

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      FACTORY_DATA_DIR: ${{ github.workspace }}/state/data
      FACTORY_LOG_DIR: ${{ github.workspace }}/logs
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar estado persistente (branch state)
        run: |
          set -e
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch state "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" state
          else
            echo "Branch state ainda não existe; começando do zero."
          fi
          mkdir -p state/data logs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Cache (kit oficial, vozes, modelo whisper)
        uses: actions/cache@v4
        with:
          path: .cache
          key: factory-cache-v1-${{ hashFiles('factory/assets/catalog.py', 'config/settings.yaml') }}
          restore-keys: factory-cache-v1-

      - name: Rodar fábrica
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACTORY_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || vars.FACTORY_DRY_RUN || '0' }}
        run: python -m factory.cli run

      - name: Persistir estado (snapshot único, sempre)
        if: always()
        run: |
          set -e
          cd state
          rm -rf .git data/run.lock
          git init -q -b state
          git config user.name "gta6-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "state snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) run ${{ github.run_id }}"
          for i in 1 2 3; do
            git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" state && break
            sleep 7
          done

      - name: Backup do banco
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-${{ github.run_id }}
          path: state/data/factory.db
          retention-days: 7
          if-no-files-found: ignore

      - name: Vídeos e logs para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_id }}
          path: |
            output/**/*.mp4
            output/**/storyboard.json
            logs/
          retention-days: 3
          if-no-files-found: ignore
