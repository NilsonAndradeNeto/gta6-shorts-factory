name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: FFmpeg (build estática; apt como reserva)
        timeout-minutes: 10
        run: |
          set -e
          if curl -fsSL --retry 3 --max-time 240 -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz; then
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo install -m 755 /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
          else
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
